[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssplat"
version = "0.1.0"
description = "Single image -> 3D Gaussian Splatting (depth lifting, hidden layer, single-view refinement)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "numpy",
  "scipy",
  "pillow",
  "opencv-python-headless",
  "onnxruntime",
  "plyfile",
  "imageio",
  "imageio-ffmpeg",
  "matplotlib",
]

[project.optional-dependencies]
moge = ["huggingface_hub"]  # plus MoGe itself: python -m ssplat.setup_env
test = ["pytest"]

[project.scripts]
ssplat = "ssplat.run:main"

[tool.setuptools.packages.find]
include = ["ssplat*"]
